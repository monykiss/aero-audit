# docker compose -f compose.yaml -f compose.observability.yaml up --build
# Adds Prometheus (scraping the app) and Grafana (provisioned dashboard). Both bind to loopback only.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/aero-rules.yml:/etc/prometheus/aero-rules.yml:ro
      - prom-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt: ["no-new-privileges:true"]
  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/aero-audit.json:/var/lib/grafana/dashboards/aero-audit.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
volumes:
  prom-data:
  grafana-data:
