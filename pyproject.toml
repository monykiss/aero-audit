[project]
name = "aero-audit"
version = "0.4.0"
description = "AI/ML + computer-vision auditing toolkit for aviation operations and ADS-B security, with a hardened local app"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "monykiss" }]
keywords = ["aviation", "ads-b", "security", "anomaly-detection", "machine-learning", "computer-vision", "risk-management", "surveillance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10", "ultralytics>=8.3"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/monykiss/aero-audit"
Repository = "https://github.com/monykiss/aero-audit"
Issues = "https://github.com/monykiss/aero-audit/issues"
Changelog = "https://github.com/monykiss/aero-audit/blob/main/CHANGELOG.md"
Security = "https://github.com/monykiss/aero-audit/blob/main/SECURITY.md"

[project.scripts]
aero = "aero_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aero_audit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# typer builds CLIs from call-in-default-argument; that is the documented idiom, not a bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
