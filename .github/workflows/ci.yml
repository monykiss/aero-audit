name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check aero_audit tests
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Docs must match code
        run: |
          .venv/bin/aero docs-build
          if ! git diff --exit-code -- docs/generated; then
            echo "docs/generated is stale; run 'aero docs-build' and commit"
            exit 1
          fi
