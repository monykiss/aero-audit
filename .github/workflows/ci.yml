name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: lint, test, docs drift, dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install (hash-verified against requirements.lock.txt)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements.lock.txt
          uv pip install --python .venv/bin/python --no-deps -e .
      - name: Lint
        run: .venv/bin/ruff check aero_audit tests
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Docs must match code
        run: |
          .venv/bin/aero docs-build
          if ! git diff --exit-code -- docs/generated; then
            echo "docs/generated is stale; run 'aero docs-build' and commit"
            exit 1
          fi
      - name: Doctor (offline)
        run: .venv/bin/aero doctor --no-net
      - name: Dependency vulnerability audit
        run: uvx pip-audit -r requirements.lock.txt --strict --desc on

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: container builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: aero-audit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the demo endpoint
        run: |
          docker run -d --rm --name aero -p 127.0.0.1:8787:8787 aero-audit:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/v1/app >/tmp/app.json 2>/dev/null && grep -q '"active": true' /tmp/app.json; then break; fi
            sleep 2
          done
          cat /tmp/app.json
          python3 -c "import json; d=json.load(open('/tmp/app.json')); assert d['source']['active'], d; assert d['security']['mode']=='open', d; print('demo source active, security mode', d['security']['mode'])"
          docker logs aero | tail -20
          docker stop aero
