version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # pydantic-core is pinned by pydantic itself; regenerate the lock with `make lock` instead
      - dependency-name: "pydantic-core"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # the base image tracks the Python line declared in pyproject; bump majors deliberately
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
