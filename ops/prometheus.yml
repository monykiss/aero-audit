# Scrape the local app. Loopback mode needs no token; in remote mode put a proxy in front (see docs/OBSERVABILITY.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: aero-audit
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8787"]
        labels:
          instance: local
rule_files:
  - /etc/prometheus/aero-rules.yml
