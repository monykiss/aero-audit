<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aero-audit live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0f1318;--panel:#161c24;--line:#263040;--text:#e6ebf2;--muted:#8a96a8;--crit:#ff4d4f;--high:#ff7a45;--med:#ffc53d;--low:#4ea1ff;--info:#7b8794;--ok:#3ddc97;--inj:#ff5cf0}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;letter-spacing:.3px}header .mode{font-size:11px;padding:2px 7px;border-radius:10px;background:#223;border:1px solid var(--line)}
header .mode.live{background:#0d3b2e;border-color:#1f7a5a;color:var(--ok)}header .status{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
#demo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);background:#12181f}
#demo span.lbl{color:var(--muted);font-size:11px;margin-right:4px}button{background:#1e2733;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
button:hover{background:#28344a}button.danger{border-color:#7a2a2a}button.clear{margin-left:auto}
#banner{display:none;background:#3a1f3a;border-bottom:1px solid #6a2f6a;padding:5px 14px;font-size:12px;color:#ffb3fa}
main{display:grid;grid-template-columns:1fr 440px;min-height:0}
#map{height:100%;min-height:0}
aside{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.tile{background:#0f141b;border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.tile b{display:block;font-size:18px;line-height:1.1}.tile span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs div{flex:1;text-align:center;padding:7px 4px;cursor:pointer;color:var(--muted);font-size:12px;border-bottom:2px solid transparent}
.tabs div.on{color:var(--text);border-bottom-color:var(--low)}
.panel{overflow:auto;flex:1;padding:8px 10px;min-height:0}.panel h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
.f{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:6px 6px;border:1px solid var(--line);border-radius:6px;margin-bottom:5px;cursor:pointer;background:#0f141b}
.f:hover{background:#18202b}.f .sev{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 5px;border-radius:4px;align-self:start;min-width:52px;text-align:center}
.sev.critical{background:#4a1416;color:var(--crit)}.sev.high{background:#4a2414;color:var(--high)}.sev.medium{background:#4a3a10;color:var(--med)}.sev.low{background:#14304a;color:var(--low)}.sev.info{background:#23282f;color:var(--info)}
.f .t{font-size:12px}.f .t small{display:block;color:var(--muted);font-size:11px}.f .r{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}.f.inj{border-color:#6a2f6a}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
.rat-critical{color:var(--crit);font-weight:700}.rat-high{color:var(--high);font-weight:700}.rat-medium{color:var(--med)}.rat-low{color:var(--ok)}
.note{color:var(--muted);font-size:11px}.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;border:1px solid var(--line);margin-right:3px}
#drawer{position:absolute;left:12px;bottom:12px;width:380px;max-height:55%;overflow:auto;background:rgba(22,28,36,.96);border:1px solid var(--line);border-radius:8px;padding:10px 12px;z-index:900;display:none;font-size:12px}
#drawer h2{font-size:14px;margin:0 0 4px}#drawer .kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:6px 0}#drawer .kv div{color:var(--muted)}#drawer .kv div b{color:var(--text);font-weight:500}
#drawer .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--muted)}
.plane{width:22px;height:22px;display:block;filter:drop-shadow(0 0 2px #000)}.plane svg{width:22px;height:22px}
.pl-normal{fill:#7fb3ff}.pl-low{fill:#4ea1ff}.pl-info{fill:#9aa5b5}.pl-medium{fill:#ffc53d}.pl-high,.pl-critical{fill:#ff4d4f}.pl-ground{fill:#5a6472}.pl-lowtrust{fill:#b47bff}.pl-injected{stroke:#ff5cf0;stroke-width:2px}.pl-emerg{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.leaflet-container{background:#0b0f14}.dark-tiles{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) saturate(.6)}.legend{position:absolute;right:12px;bottom:12px;z-index:900;background:rgba(22,28,36,.92);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.spark{width:100%;height:60px}.kpi-row{display:flex;gap:10px;flex-wrap:wrap}.kpi-row .tile{flex:1;min-width:90px}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>aero-audit</h1><span id="mode" class="mode">…</span>
  <span id="where" class="note"></span>
  <span class="status" id="status">connecting…</span>
</header>
<div id="demo" hidden>
  <span class="lbl">DEMO · inject an attack into the live stream and watch detection:</span>
  <button data-k="teleport">Teleport 30 nm</button><button data-k="squawk_7500" class="danger">Squawk 7500</button>
  <button data-k="altitude_forge">Altitude +6,000 ft</button><button data-k="velocity_forge">Speed halved</button>
  <button data-k="ghost_jumpy">Ghost (jumpy)</button><button data-k="ghost_perfect">Ghost (perfect)</button>
  <button data-k="flood">Flood 60 addresses</button><button data-k="collapse">Coverage collapse</button>
  <button id="clear" class="clear">Clear injections</button>
</div>
<div id="banner"></div>
<main>
  <div style="position:relative;min-height:0">
    <div id="map"></div>
    <div id="drawer"><span class="x" onclick="closeDrawer()">✕</span><div id="drawerBody"></div></div>
    <div class="legend"><i style="background:#7fb3ff"></i>normal <i style="background:#ffc53d"></i>medium <i style="background:#ff4d4f"></i>high/critical <i style="background:#b47bff"></i>low trust <i style="background:#5a6472"></i>ground <i style="border:2px solid #ff5cf0;background:none"></i>injected</div>
  </div>
  <aside>
    <div class="tiles" id="tiles"></div>
    <div class="tabs" id="tabs">
      <div data-t="feed" class="on">Findings</div><div data-t="safety">Safety</div><div data-t="security">Security</div><div data-t="ops">Operations</div><div data-t="risk">Risk</div><div data-t="model">Model</div>
    </div>
    <div class="panel" id="panel"></div>
  </aside>
</main>
</div>
<script>
const PLANE = '<svg viewBox="0 0 24 24" class="CLS" style="transform:rotate(ROTdeg)"><path d="M12 2l2 7 8 4v2l-8-2v5l3 2v2l-5-1-5 1v-2l3-2v-5l-8 2v-2l8-4z"/></svg>';
let map, markers = {}, trail = null, selected = null, tab = 'feed', S = null, lastRisk = null, lastThreats = null, lastEval = null, lastModel = null, lastImpact = null, riskAt = 0;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTs(t){return t?new Date(t*1000).toISOString().substr(11,8)+'Z':'-'}
function num(v,d=0){return (v===null||v===undefined||isNaN(v))?'-':Number(v).toFixed(d)}
function initMap(c){map=L.map('map',{zoomControl:true,attributionControl:true}).setView(c||[40.7,-74],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,className:'dark-tiles',attribution:'&copy; OpenStreetMap contributors'}).addTo(map);}
function planeIcon(a){let cls='pl-normal';if(a.ground)cls='pl-ground';else if(a.sev)cls='pl-'+a.sev;if(a.trust<0.5)cls='pl-lowtrust';let extra=(a.injected?' pl-injected':'')+(a.emergency?' pl-emerg':'');
return L.divIcon({className:'plane',html:PLANE.replace('CLS',cls+extra).replace('ROT',a.track||0),iconSize:[22,22],iconAnchor:[11,11]})}
function updateMap(ac){const seen=new Set();for(const a of ac){seen.add(a.icao24);let m=markers[a.icao24];const ll=[a.lat,a.lon];
if(!m){m=L.marker(ll,{icon:planeIcon(a)}).addTo(map);m.on('click',()=>select(a.icao24));markers[a.icao24]=m}else{m.setLatLng(ll);m.setIcon(planeIcon(a))}
m.bindTooltip(`${a.callsign||a.icao24} · ${num(a.alt)} ft · ${num(a.gs)} kt${a.sev?' · '+a.sev.toUpperCase():''}${a.injected?' · INJECTED':''}`,{direction:'top',offset:[0,-8]});}
for(const k of Object.keys(markers)){if(!seen.has(k)){map.removeLayer(markers[k]);delete markers[k]}}}
async function select(icao){selected=icao;const r=await fetch('/api/aircraft/'+icao);if(!r.ok)return;const d=await r.json();const st=d.state||{};
if(trail){map.removeLayer(trail);trail=null}if(d.trail.length>1){trail=L.polyline(d.trail.map(p=>[p.lat,p.lon]),{color:d.injected?'#ff5cf0':'#4ea1ff',weight:2,opacity:.8,dashArray:d.injected?'4 4':null}).addTo(map)}
const fs=d.findings.map(f=>`<div class="f ${f.injected?'inj':''}"><span class="sev ${f.severity}">${f.severity}</span><span class="t">${f.rule} ${esc(f.title)}<small>${fmtTs(f.ts)} · risk ${f.risk} · ×${f.occurrences}${f.playbook?' · '+esc(f.playbook):''}</small></span><span class="r"></span></div>`).join('')||'<div class="note">no findings for this aircraft</div>';
document.getElementById('drawerBody').innerHTML=`<h2>${esc(st.callsign||'')} <span class="note">${icao}${d.injected?' · <span style="color:#ff5cf0">INJECTED</span>':''}</span></h2>
<div class="kv"><div>registration <b>${esc(st.registration||'-')}</b></div><div>type <b>${esc(st.aircraft_type||'-')}</b></div><div>altitude <b>${num(st.baro_alt_ft)} ft</b></div><div>speed <b>${num(st.gs_kt)} kt</b></div><div>track <b>${num(st.track_deg)}°</b></div><div>v/s <b>${num(st.vrate_fpm)} fpm</b></div><div>squawk <b>${esc(st.squawk||'-')}</b></div><div>source <b>${esc(st.position_source||'-')}</b></div><div>NIC/NACp/SIL <b>${st.nic??'-'}/${st.nac_p??'-'}/${st.sil??'-'}</b></div><div>trust <b>${d.trust}</b></div></div>
<h3 style="font-size:11px;color:var(--muted);margin:6px 0 4px">FINDINGS (${d.findings.length})</h3>${fs}`;
document.getElementById('drawer').style.display='block';}
function closeDrawer(){document.getElementById('drawer').style.display='none';selected=null;if(trail){map.removeLayer(trail);trail=null}}
function sevCount(k,s){return s.kpis.by_severity[k]||0}
function tiles(s){const k=s.kpis;const comp=k.compliance==null?'n/a':(k.compliance*100).toFixed(1)+'%';
document.getElementById('tiles').innerHTML=[[k.tracked,'aircraft now'],[k.airborne,'airborne'],[k.unique_aircraft,'seen total'],[k.findings_total,'findings'],
[sevCount('critical',s)+sevCount('high',s),'critical + high'],[sevCount('medium',s),'medium'],[comp,'integrity compliance'],[k.low_trust.length,'low trust']].map(([v,l])=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('')}
function findingRow(f){return `<div class="f ${f.injected?'inj':''}" onclick="focusAc('${f.icao24||''}')"><span class="sev ${f.severity}">${f.severity}</span><span class="t">${f.rule} · ${esc(f.callsign||f.icao24||'-')}<small>${esc(f.title)}</small>${f.playbook?`<small>→ ${esc(f.playbook)}</small>`:''}</span><span class="r">${fmtTs(f.ts)}<br>risk ${f.risk}</span></div>`}
function focusAc(icao){if(!icao)return;const m=markers[icao];if(m){map.panTo(m.getLatLng())}select(icao)}
function spark(pts,w=420,h=60){if(pts.length<2)return'';const xs=pts.map((p,i)=>i),ys=pts.map(p=>p.n);const mx=Math.max(...ys)||1,mn=Math.min(...ys);
const path=pts.map((p,i)=>`${(i/(pts.length-1))*w},${h-((p.n-mn)/(mx-mn||1))*(h-8)-4}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${path}" fill="none" stroke="#4ea1ff" stroke-width="1.5"/></svg><div class="note">aircraft per poll: min ${mn}, max ${mx}, last ${ys[ys.length-1]}</div>`}
function byRule(s,ids){return s.ranked.filter(f=>ids.includes(f.rule))}
function eventsByRule(s,ids){return s.events.filter(f=>ids.includes(f.rule))}
function panelFeed(s){const inj=s.injections.length?`<div class="note" style="color:#ffb3fa;margin-bottom:6px">active injections: ${s.injections.map(i=>i.kind+(i.icao24?' → '+i.icao24:'')+' ('+i.remaining+' polls left)').join('; ')}</div>`:'';
return inj+`<h3>Latest findings (newest first)</h3>${s.events.slice(0,25).map(findingRow).join('')||'<div class="note">none yet</div>'}<h3>Highest risk this session</h3>${s.ranked.slice(0,15).map(findingRow).join('')}`}
function panelSafety(s){const em=s.kpis.emergencies;const met=s.metars.length?`<h3>Weather (METAR)</h3><table>${s.metars.map(m=>`<tr><td>${m.station}</td><td>wind ${m.wind} kt</td><td>vis ${m.visib}</td><td>${m.cover||''}</td><td>${m.temp}°C</td></tr>`).join('')}</table>`:'<h3>Weather</h3><div class="note">no METAR (replay mode or stations unavailable)</div>';
return `<h3>Emergency / interference codes now (${em.length})</h3>${em.length?em.map(a=>`<div class="f" onclick="focusAc('${a.icao24}')"><span class="sev critical">${a.squawk}</span><span class="t">${esc(a.callsign||a.icao24)}<small>${num(a.alt)} ft · ${num(a.gs)} kt · ${a.src}</small></span><span class="r">trust ${a.trust}</span></div>`).join(''):'<div class="note">none: no 7500 / 7600 / 7700 in the current picture</div>'}
<h3>Separation screen (SAF-004)</h3>${eventsByRule(s,['SAF-004']).slice(0,8).map(findingRow).join('')||'<div class="note">no pairs inside 3 nm / 900 ft above 3,000 ft</div>'}
<h3>Vertical profile (SAF-003 vertical rate, OPS-004 level deviation)</h3>${eventsByRule(s,['SAF-003','OPS-004']).slice(0,8).map(findingRow).join('')||'<div class="note">none</div>'}
<h3>Emergency squawks and status (SEC-001..004)</h3>${eventsByRule(s,['SEC-001','SEC-002','SEC-003','SEC-004']).slice(0,6).map(findingRow).join('')||'<div class="note">none this session</div>'}${met}`}
function panelSecurity(s){const k=s.kpis;const rc=k.by_rule;const lt=k.low_trust;
const stream=(rc['SEC-016']||rc['SEC-017'])?`<div class="f"><span class="sev high">stream</span><span class="t">bursts: ${rc['SEC-016']||0} · collapses: ${rc['SEC-017']||0}</span><span class="r"></span></div>`:'<div class="note" style="color:var(--ok)">no address burst or coverage collapse this session</div>';
return `<h3>Spoofing / injection indicators</h3>${eventsByRule(s,['SEC-010','SEC-011','SEC-014','SEC-015','SEC-018']).slice(0,10).map(findingRow).join('')||'<div class="note" style="color:var(--ok)">none: kinematics consistent for every tracked aircraft</div>'}
<h3>Stream health (flooding SEC-016, jamming SEC-017)</h3>${stream}
<h3>Integrity (SEC-012)</h3><div class="note">compliance ${k.compliance==null?'n/a on this feed':(k.compliance*100).toFixed(1)+'% of '+k.compliance_fixes+' airborne ADS-B fixes'} · ${rc['SEC-012']||0} aircraft below 91.227 minimums</div>
<h3>Low-trust aircraft (${lt.length})</h3>${lt.length?`<table><tr><th>icao</th><th>trust</th><th>findings</th></tr>${lt.map(r=>`<tr onclick="focusAc('${r[0]}')" style="cursor:pointer"><td>${r[0]}</td><td>${r[1].toFixed(2)}</td><td>${r[2]}</td></tr>`).join('')}</table>`:'<div class="note">none below 0.5</div>'}
<h3>Identity (SEC-013 no flight ID, SEC-020 watchlist)</h3>${eventsByRule(s,['SEC-013','SEC-020']).slice(0,6).map(findingRow).join('')||'<div class="note">none</div>'}`}
function panelOps(s){const rc=s.kpis.by_rule;const imp=lastImpact;const regions=[...new Set(s.counts.map(c=>c.region))];
const sparks=regions.map(r=>`<div class="note"><b>${r}</b></div>`+spark(s.counts.filter(c=>c.region===r))).join('');
return `<h3>Holding (OPS-002) and its cost</h3>${imp?`<div class="kpi-row"><div class="tile"><b>${imp.holds}</b><span>holds</span></div><div class="tile"><b>${imp.observed_minutes}</b><span>minutes</span></div><div class="tile"><b>${imp.fuel_kg}</b><span>kg fuel</span></div><div class="tile"><b>${(imp.co2_kg/1000).toFixed(1)} t</b><span>CO2</span></div><div class="tile"><b>€${imp.delay_cost}</b><span>delay cost</span></div></div><div class="note">observed minutes are a floor; defaults 40 kg/min, 3.16 kg CO2/kg, €100/min</div>`:'<div class="note">loading</div>'}
${eventsByRule(s,['OPS-002']).slice(0,6).map(findingRow).join('')}
<h3>Airspace density</h3><div class="note">pattern work / low orbits (OPS-003): ${rc['OPS-003']||0} · coverage gaps (OPS-001): ${rc['OPS-001']||0} · VFR code above FL180 (OPS-005): ${rc['OPS-005']||0}</div>
<h3>Traffic per poll</h3>${sparks||'<div class="note">waiting for data</div>'}
<h3>Feed health</h3><div class="note">provider ${s.provider} · ${s.batches} polls · data age ${s.feed_latency_ms==null?'n/a':(s.feed_latency_ms/1000).toFixed(0)+' s'} · last poll ${s.last_ingest_age_s??'-'} s ago${s.errors.length?'<br><span style="color:var(--high)">'+esc(s.errors[s.errors.length-1])+'</span>':''}</div>`}
function panelRisk(){if(!lastRisk)return'<div class="note">loading</div>';
const rows=lastRisk.map(r=>`<tr><td>${r.id}</td><td>${esc(r.title)}</td><td>${r.baseline_L}→${r.L}</td><td>${r.I}</td><td class="rat-${r.rating}">${r.score} ${r.rating}</td><td class="rat-${r.residual_rating}">${r.residual}</td><td>${r.observed_hits} (${r.rate_lb_per_1000}/1k)</td></tr>`).join('');
const th=lastThreats?lastThreats.map(t=>`<tr><td>${t.id}</td><td>${esc(t.threat)}</td><td class="rat-${t.coverage==='covered'?'low':(t.coverage==='partial'?'medium':'critical')}">${t.coverage}</td><td>${esc(t.rules)}</td><td>${esc(t.measured)}</td></tr>`).join(''):'';
return `<h3>Risk register (evidence-adjusted, this session)</h3><table><tr><th>id</th><th>risk</th><th>L</th><th>I</th><th>inherent</th><th>residual</th><th>evidence</th></tr>${rows}</table><div class="note">likelihood moves on precision-weighted hits at the Wilson 95% lower bound; residual = inherent × (1 − control effectiveness)</div>
<h3>Threat coverage with measured recall</h3><table><tr><th>id</th><th>threat</th><th>coverage</th><th>rules</th><th>measured</th></tr>${th}</table>`}
function panelModel(){const e=lastEval,m=lastModel;if(!e||!e.scenarios)return'<div class="note">no evaluation on disk; run aero evaluate</div>';
const rows=e.scenarios.map(r=>`<tr><td>${r.name}</td><td>${r.known_gap?'known gap':r.expected_rules.join(', ')}</td><td class="${r.recall>=.8?'rat-low':(r.recall>=.5?'rat-medium':'rat-critical')}">${(r.recall*100).toFixed(0)}%</td><td>${r.median_ttd_s==null?'-':r.median_ttd_s.toFixed(0)+' s'}</td></tr>`).join('');
const prec=Object.entries(e.rule_precision||{}).map(([k,v])=>`<span class="pill">${k} ${v==null?'n/a':v.toFixed(2)}</span>`).join('');
return `<h3>Model</h3><div class="note">${m?`${m.rows} rows · ${m.aircraft} aircraft · holdout flag rate ${(m.holdout_flag_rate*100).toFixed(2)}% · trained ${m.trained_at} · sha ${String(m.sha256).slice(0,10)}`:'no registry'}</div>
<h3>Measured detection (injected scenarios on real traffic)</h3><div class="note">background ${esc(e.recording)} · median revisit ${e.median_revisit_s?e.median_revisit_s.toFixed(0)+' s':'-'}</div><table><tr><th>scenario</th><th>expected</th><th>recall</th><th>TTD</th></tr>${rows}</table>
<h3>Rule precision (feeds risk scoring)</h3>${prec}`}
function render(){if(!S)return;const p=document.getElementById('panel');p.innerHTML={feed:panelFeed,safety:panelSafety,security:panelSecurity,ops:panelOps,risk:panelRisk,model:panelModel}[tab](S)}
async function slow(){try{const t=Date.now();if(t-riskAt>20000){riskAt=t;[lastRisk,lastThreats,lastEval,lastModel,lastImpact]=await Promise.all(['/api/risk','/api/threats','/api/evaluation','/api/model','/api/impact'].map(u=>fetch(u).then(r=>r.json())))}}catch(e){}}
async function poll(){try{const r=await fetch('/api/state');S=await r.json();if(!map)initMap(S.center);
document.getElementById('mode').textContent=S.mode.toUpperCase();document.getElementById('mode').className='mode '+(S.mode==='live'?'live':'');
document.getElementById('where').textContent=`${S.provider} · ${S.region}${S.batch_region&&S.batch_region!==S.region?' · now '+S.batch_region:''}`;
document.getElementById('status').textContent=`poll ${fmtTs(S.batch_ts)} · ${S.batches} polls · ${S.kpis.tracked} aircraft · up ${Math.floor(S.uptime_s/60)} min`;

tiles(S);updateMap(S.aircraft);await slow();render();if(selected&&markers[selected]===undefined&&!S.aircraft.find(a=>a.icao24===selected)){}}catch(e){document.getElementById('status').textContent='disconnected: '+e}}

const body={kind:b.dataset.k};if(selected&&['teleport','squawk_7500','altitude_forge','velocity_forge'].includes(b.dataset.k))body.icao24=selected;

poll();setInterval(poll,3000);
